name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Node 22 bundles npm 10, which can stall while reifying this npm-11
      # lockfile. Use the same package-manager release on both test lanes.
      - name: Align npm version
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run test:docs
      - run: npm run test:security
      - run: npm test
      - run: npm run test:quality
      - run: npm run build
      - run: npm run test:package

  # The gallery in a real browser over the in-memory provider: buttons,
  # progress badge, regeneration history, free restore, no console errors.
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Align npm version
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)" npm run test:gallery

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run website:check
      - run: npm run website:lint
      - run: npm run website:build
